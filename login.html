<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm 2 Home</title>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page-background"></div>

    <nav class="navbar">
      <div class="logo">
        <div class="logo-main">Farm<span class="highlight">2</span>Home</div>
        <small class="tagline" id="txt-tagline">Freshness Delivered.</small>
      </div>

      <div class="controls">
        <select id="language-select" onchange="changeLanguage()">
          <option value="en">English</option>
          <option value="hi">हिंदी</option>
          <option value="mr">मराठी</option>
        </select>
      </div>
    </nav>

    <main>
      <div class="intro-text">
        <h1 id="txt-title">Welcome to Farm2Home</h1>
        <p id="txt-subtitle">
          Select your profile type to access the dashboard.
        </p>
      </div>

      <div class="card-container">
        <div class="card">
          <div class="card-image">
            <img
              src="https://sl.bing.net/i4oWpIvTnbM"
              alt="Farmer"
              onerror="this.src='https://images.unsplash.com/photo-1605000797499-95a51c5269ae?q=80&w=800&auto=format&fit=crop'"
            />
          </div>
          <div class="card-body">
            <h2 id="txt-farmer">Farmer</h2>
            <p id="txt-farmer-desc">List crops and manage sales.</p>
            <button class="btn-primary">
              <span id="txt-btn-1">Login as Farmer</span> &rarr;
            </button>
          </div>
        </div>

        <div class="card">
          <div class="card-image">
            <img
              src="https://sl.bing.net/czYfpDTj2yW"
              alt="Customer"
              onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=800&auto=format&fit=crop'"
            />
          </div>
          <div class="card-body">
            <h2 id="txt-customer">Customer</h2>
            <p id="txt-customer-desc">Order fresh straight from the source.</p>
            <button class="btn-secondary">
              <span id="txt-btn-2">Login as Customer</span> &rarr;
            </button>
          </div>
        </div>
      </div>

      <div class="footer-links">
        <a href="#" id="txt-guest">Guest View</a> •
        <a href="#" id="txt-help">Need Help?</a>
      </div>
    </main>

    <script>
      const translations = {
        en: {
          tagline: "Freshness Delivered.",
          title: "Welcome to Farm2Home",
          subtitle: "Select your profile type to access the dashboard.",
          farmer: "Farmer",
          farmerDesc: "List crops and manage sales.",
          customer: "Customer",
          customerDesc: "Order fresh straight from the source.",
          btn: "Login as ",
          guest: "Guest View",
          help: "Need Help?",
        },
        hi: {
          tagline: "ताजा वितरण।",
          title: "Farm2Home में स्वागत है",
          subtitle: "डैशबोर्ड तक पहुंचने के लिए अपनी प्रोफ़ाइल चुनें।",
          farmer: "किसान",
          farmerDesc: "फसलें सूचीबद्ध करें और बिक्री प्रबंधित करें।",
          customer: "ग्राहक",
          customerDesc: "सीधे स्रोत से ताजा ऑर्डर करें।",
          btn: "लॉगिन करें: ",
          guest: "अतिथि दृश्य",
          help: "मदद चाहिए?",
        },
        mr: {
          tagline: "ताजेपणा वितरित.",
          title: "Farm2home मध्ये आपले स्वागत आहे",
          subtitle: "डॅशबोर्डवर जाण्यासाठी आपली प्रोफाइल निवडा.",
          farmer: "शेतकरी",
          farmerDesc: "पिके सूचीबद्ध करा आणि विक्री व्यवस्थापित करा.",
          customer: "ग्राहक",
          customerDesc: "थेट स्त्रोताकडून ताजे मागवा.",
          btn: "लॉगिन करा: ",
          guest: "पाहुणे दृश्य",
          help: "मदत हवी?",
        },
      };

      function changeLanguage() {
        const lang = document.getElementById("language-select").value;
        const t = translations[lang];

        document.getElementById("txt-tagline").innerText = t.tagline;
        document.getElementById("txt-title").innerText = t.title;
        document.getElementById("txt-subtitle").innerText = t.subtitle;
        document.getElementById("txt-farmer").innerText = t.farmer;
        document.getElementById("txt-farmer-desc").innerText = t.farmerDesc;
        document.getElementById("txt-customer").innerText = t.customer;
        document.getElementById("txt-customer-desc").innerText = t.customerDesc;
        document.getElementById("txt-btn-1").innerText =
          t.btn + (lang === "en" ? "Farmer" : t.farmer);
        document.getElementById("txt-btn-2").innerText =
          t.btn + (lang === "en" ? "Customer" : t.customer);
        document.getElementById("txt-guest").innerText = t.guest;
        document.getElementById("txt-help").innerText = t.help;
      }
    </script>
  </body>
</html>
