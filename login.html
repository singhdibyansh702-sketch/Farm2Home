<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm 2 Home</title>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page-background"></div>

    <nav class="navbar">
      <div class="logo">
        <div class="logo-main">Farm<span class="highlight">2</span>Home</div>
        <small class="tagline" id="txt-tagline">Freshness Delivered.</small>
      </div>

      <div class="controls">
        <select id="language-select">
          <option value="en">English</option>
          <option value="hi">हिंदी</option>
          <option value="mr">मराठी</option>
        </select>
      </div>
    </nav>

    <main>
      <div class="intro-text">
        <h1 id="txt-title">Welcome to Farm2Home</h1>
        <p id="txt-subtitle">
          Select your profile type to access the dashboard.
        </p>
      </div>

      <div class="card-container">
        <div class="card">
          <div class="card-image">
            <img
              src="https://sl.bing.net/i4oWpIvTnbM"
              alt="Farmer"
              onerror="
                this.src =
                  'https://images.unsplash.com/photo-1605000797499-95a51c5269ae?q=80&w=800&auto=format&fit=crop'
              "
            />
          </div>
          <div class="card-body">
            <h2 id="txt-farmer">Farmer</h2>
            <p id="txt-farmer-desc">List crops and manage sales.</p>

            <button class="btn-primary">
              <span id="txt-btn-1">Login as Farmer</span> &rarr;
            </button>

            <div class="auth-switch">
              <span id="txt-new-1">New here?</span>
              <a href="#" id="lnk-reg-1">Register &gt;</a>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-image">
            <img
              src="https://sl.bing.net/czYfpDTj2yW"
              alt="Customer"
              onerror="
                this.src =
                  'https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=800&auto=format&fit=crop'
              "
            />
          </div>
          <div class="card-body">
            <h2 id="txt-customer">Customer</h2>
            <p id="txt-customer-desc">Order fresh straight from the source.</p>

            <button class="btn-secondary">
              <span id="txt-btn-2">Login as Customer</span> &rarr;
            </button>

            <div class="auth-switch">
              <span id="txt-new-2">New here?</span>
              <a href="#" id="lnk-reg-2">Register &gt;</a>
            </div>
          </div>
        </div>
      </div>

      <div class="footer-links">
        <a href="#" id="txt-guest">Guest View</a> •
        <a href="#" id="txt-help">Need Help?</a>
      </div>
    </main>

    <script src="login.js"></script>
  </body>
</html>
